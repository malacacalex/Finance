# =============================================================================
# Veille d'actualités par dorking (GRP-12, conception §7.1)
# Source : Google News RSS (gratuit, sans clé). Opérateurs acceptés :
#   "expression exacte", OR, -exclure, site:domaine, intitle:mot, when:7d
# Variables : {nom}, {secteur_requete}, {site_ir}
# =============================================================================

fenetre: "when:7d"
langue: {hl: "fr", gl: "FR", ceid: "FR:fr"}
pause_secondes: 2.0          # politesse entre deux requêtes (Google limite le débit : HTTP 429)
max_par_categorie: 15        # on garde les N plus récentes par catégorie

modeles:                     # catégorie -> requête
  resultats:  '"{nom}" (résultats OR "chiffre d''affaires" OR guidance OR trimestre OR semestre)'
  communique: '"{nom}" (communiqué OR annonce OR contrat OR acquisition OR dividende OR investissement)'
  presse:     '"{nom}" (action OR bourse OR analyste OR objectif)'
  secteur:    '{secteur_requete} -"{nom}" -emploi -poste -recrutement -job'
  macro:      '(BCE OR "taux directeurs" OR inflation OR "zone euro") (Bourse OR marchés) "CAC 40"'
  officiel:   '"{nom}" site:{site_ir}'

# Fiabilité SUGGÉRÉE selon la source (1..3) — le groupe confirme dans le classeur
fiabilite_sources:
  3: [amf-france.org, euronext.com, airliquide.com, finance.hermes.com, capgemini.com,
      totalenergies.com, investor.3ds.com, 3ds.com, reuters.com, bloomberg.com]
  2: [lesechos.fr, investir.lesechos.fr, boursier.com, zonebourse.com, abcbourse.com,
      bfmtv.com, lefigaro.fr, lemonde.fr, boursorama.com, latribune.fr, cerclefinance.com,
      finance.yahoo.com, fr.finance.yahoo.com, ft.com, wsj.com, agefi.fr, capital.fr]
  # tout le reste : 1

# Lexique pour la SUGGESTION automatique du sens d'une nouvelle (pas une note du groupe).
# Recherche dans le titre en minuscules, sans accents. Un mot positif et un négatif => 0.
lexique:
  positif: [hausse, progresse, record, releve, relève, croissance, bondit, grimpe, depasse, dépasse,
            contrat, remporte, acquisition, rachat, "objectif de cours releve", surperforme,
            optimiste, solide, renforce, investit, upgrade, raises, beats, gains, rises]
  negatif: [baisse, recule, chute, abaisse, degrade, dégradé, amende, avertissement, perte, plonge,
            decroche, décroche, menace, enquete, enquête, sanction, ralentissement, deception, déception,
            pessimiste, cede, cède, downgrade, cuts, misses, falls, drops, warning]
